<canvas id="starfield" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:0.5;"></canvas>
<script>
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let W = canvas.width = window.innerWidth;
    let H = canvas.height = window.innerHeight;

    const NUM_STARS = 300;
    const SPEED = 4;

    const stars = Array.from({length: NUM_STARS}, () => ({
        x: (Math.random() - 0.5) * W,
        y: (Math.random() - 0.5) * H,
        z: Math.random() * W,
        pz: 0
    }));

    function draw() {
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(0, 0, W, H);

        stars.forEach(star => {
            star.pz = star.z;
            star.z -= SPEED;

            if (star.z <= 0) {
                star.x  = (Math.random() - 0.5) * W;
                star.y  = (Math.random() - 0.5) * H;
                star.z  = W;
                star.pz = W;
            }

            // Posisi layar sekarang
            const sx = (star.x / star.z) * W + W / 2;
            const sy = (star.y / star.z) * H + H / 2;

            // Posisi layar sebelumnya (untuk trail)
            const px = (star.x / star.pz) * W + W / 2;
            const py = (star.y / star.pz) * H + H / 2;

            const progress = 1 - star.z / W;
            const brightness = Math.floor(progress * 255);
            const size = Math.max(1, progress * 2.5);

            // Warna bintang: jauh biru, dekat putih
            const r = brightness;
            const g = brightness;
            const b = 255;

            // Trail
            ctx.strokeStyle = `rgba(${r},${g},${b},${progress * 0.8})`;
            ctx.lineWidth = size;
            ctx.beginPath();
            ctx.moveTo(px, py);
            ctx.lineTo(sx, sy);
            ctx.stroke();

            // Titik bintang
            ctx.fillStyle = `rgba(${r},${g},${b},${progress})`;
            ctx.beginPath();
            ctx.arc(sx, sy, size, 0, Math.PI * 2);
            ctx.fill();
        });

        requestAnimationFrame(draw);
    }

    draw();

    window.addEventListener('resize', () => {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
    });
</script>
